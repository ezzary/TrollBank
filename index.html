<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1117"><title>Troll.Bank</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.3.0/dist/tonconnect-ui.min.js"></script>
</head><body><main class="app">
<header class="topbar"><div><div class="brand">Troll<span>.Bank</span></div><div class="subtitle" id="welcome">TON Wallet</div></div><div id="connectButton"></div></header>
<section class="balance-card"><div class="muted">Баланс подключённого кошелька</div><div class="balance" id="balance">— TON</div><div class="change">Реальный баланс появится после подключения</div><div class="address-row"><span id="walletAddress">Кошелёк не подключён</span><button class="copy" id="copyBtn">Копировать</button></div></section>
<section class="actions"><button class="action" id="sendBtn"><span>↗</span><b>Отправить</b></button><button class="action" id="receiveBtn"><span>↓</span><b>Получить</b></button><button class="action" id="swapBtn"><span>⇄</span><b>Swap</b></button></section>
<section class="section"><div class="section-title"><h2>Активы</h2></div><div class="asset-list">
<div class="asset"><div class="coin">T</div><div class="asset-main"><b>Toncoin</b><span>TON</span></div><div class="asset-value"><b id="assetTon">— TON</b><span>Подключите кошелёк</span></div></div>
<div class="asset"><div class="coin">$</div><div class="asset-main"><b>Tether USD</b><span>USDT</span></div><div class="asset-value"><b>— USDT</b><span>Следующим этапом</span></div></div></div></section>
<section class="section"><div class="section-title"><h2>Статус</h2></div><div class="note" id="status">Кошелёк не подключён. Нажмите Connect Wallet.</div></section>
<nav class="bottom-nav"><button class="nav active">⌂<small>Главная</small></button><button class="nav" id="walletBtn">◈<small>Кошелёк</small></button><button class="nav" id="swapNav">⇄<small>Swap</small></button><button class="nav" id="settingsBtn">⚙<small>Настройки</small></button></nav>
</main><div class="modal hidden" id="modal"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script src="./app.js"></script></body></html>
